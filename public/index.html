<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DENexPharm — Pharmacy Learning & Competition</title>
<style>
:root{--p:#2563eb;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#dfe5ee;--good:#14804a;--bad:#c62828}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:18px}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:3}.bar{max-width:1100px;margin:auto;padding:12px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:21px}.pill{padding:7px 10px;border-radius:999px;background:#eef4ff;color:#174ea6;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 18px rgba(16,24,40,.04);margin-bottom:14px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800}.primary{background:var(--p);color:#fff}.ghost{background:#eef2f7;color:var(--text)}.danger{background:#feeceb;color:var(--bad)}.full{width:100%}.muted{color:var(--muted)}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:5px 0 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.nav button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px}.nav button.active{border-color:var(--p);color:var(--p)}.question{font-size:20px;font-weight:850;line-height:1.45;margin:18px 0}.option{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px;margin:8px 0}.option.correct{border-color:var(--good);background:#ecf9f2}.option.wrong{border-color:var(--bad);background:#fff1f0}.explain{padding:12px;border-radius:11px;background:#eff6ff;margin-top:12px}.barline{height:8px;background:#e8edf5;border-radius:99px;overflow:hidden}.barline i{display:block;height:100%;background:var(--p)}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.notice{padding:11px;border-radius:11px;background:#fff8df;margin-bottom:12px}.ok{color:var(--good)}.err{color:var(--bad)}@media(max-width:650px){.row{grid-template-columns:1fr}.brand{font-size:18px}}
</style></head>
<body>
<div class="top"><div class="bar"><div class="brand">💊 DENexPharm</div><div id="status"></div></div></div>
<div class="wrap"><div id="app"></div></div>
<script>
const API='';
let token=localStorage.getItem('denex_token')||'';
let me=null, filters={countries:[],levels:['100','200','300','400','500','600'],subjects:[],topics:[]};
let quiz=[],qIndex=0,score=0,answered=false,selected=-1,activeTab='home';
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function api(path,opt={}){const h=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(token)h.Authorization='Bearer '+token;const r=await fetch(API+path,Object.assign({},opt,{headers:h}));let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}
function saveToken(t){token=t||'';if(token)localStorage.setItem('denex_token',token);else localStorage.removeItem('denex_token')}
async function boot(){try{await loadFilters();if(token){try{me=(await api('/api/me')).user||null}catch{saveToken('');me=null}}render()}catch(e){$('app').innerHTML='<div class="card"><h2>DENexPharm</h2><p class="err">'+esc(e.message)+'</p><button class="btn primary" onclick="boot()">Retry</button></div>'}}
async function loadFilters(){filters=await api('/api/question-filters')}
function status(){if(me){$('status').innerHTML='<span class="pill">'+esc(me.name)+' · '+Number(me.xp||0)+' XP'+(me.premium?' · PREMIUM':'')+'</span>'}else $('status').innerHTML='<span class="pill">Free learning</span>'}
function render(){status();if(!me){authScreen();return}nav();if(activeTab==='home')home();else if(activeTab==='quiz')quizSetup();else if(activeTab==='leaderboard')leaderboard();else if(activeTab==='profile')profile();}
function nav(){document.querySelector('.nav')?.remove();const n=document.createElement('div');n.className='nav';n.innerHTML=`<button onclick="tab('home')">🏠 Home</button><button onclick="tab('quiz')">🧠 Quiz</button><button onclick="tab('leaderboard')">🏆 Leaderboard</button><button onclick="tab('profile')">👤 Profile</button><button onclick="logout()">Log out</button>`;$('app').prepend(n)}
function tab(t){activeTab=t;render()}
function authScreen(){document.querySelector('.nav')?.remove();$('app').innerHTML=`<div class="grid"><div class="card"><h1>Learn pharmacy. Practice. Compete.</h1><p class="muted">Country and level-aware pharmacy questions, explanations, XP, scores and leaderboard.</p><div class="notice">Free accounts get the first 10 questions per country, level and subject. Premium unlocks the remaining bank.</div></div><div class="card"><div class="nav"><button id="loginTab" class="active" onclick="authMode('login')">Sign in</button><button id="regTab" onclick="authMode('register')">Create account</button></div><div id="authForm"></div></div></div>`;authMode('login')}
function authMode(mode){$('loginTab').classList.toggle('active',mode==='login');$('regTab').classList.toggle('active',mode==='register');$('authForm').innerHTML=mode==='login'?`<h2>Sign in</h2><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button class="btn primary full" onclick="login()">Sign in</button>`:`<h2>Create account</h2><label>Name<input id="name"></label><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><div class="row"><label>Country<select id="country">${filters.countries.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label>Level<select id="level">${filters.levels.map(x=>`<option>${x}</option>`).join('')}</select></label></div><label>University<input id="university"></label><button class="btn primary full" onclick="register()">Create account</button>`}
async function login(){try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});saveToken(d.token);me=d.user;activeTab='home';render()}catch(e){alert(e.message)}}
async function register(){try{const d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:$('name').value,email:$('email').value,password:$('password').value,country:$('country').value,level:$('level').value,university:$('university').value})});saveToken(d.token);me=d.user;activeTab='home';render()}catch(e){alert(e.message)}}
function home(){$('app').innerHTML+=`<div class="card"><h2>Welcome, ${esc(me.name)}</h2><p class="muted">${esc(me.country||'Country not set')} · Level ${esc(me.level||'200')}</p><div class="grid"><button class="btn primary" onclick="tab('quiz')">Start quiz</button><button class="btn ghost" onclick="tab('leaderboard')">View leaderboard</button><button class="btn ghost" onclick="tab('profile')">My profile</button></div></div><div class="grid"><div class="card"><b>📚 Question bank</b><p class="muted">${filters.subjects.length} subjects currently represented in the loaded bank.</p></div><div class="card"><b>⭐ Access</b><p>${me.premium?'<span class="ok">Premium active</span>':'Free account — 10 questions per country/level/subject'}</p>${!me.premium?'<button class="btn primary" onclick="upgrade()">Upgrade to Premium — ₦5,000</button>':''}</div></div>`}
function quizSetup(){const countries=filters.countries.length?filters.countries:[me.country||'Nigeria'];$('app').innerHTML+=`<div class="card"><h2>Quiz</h2><div class="row"><label>Country<select id="qc">${countries.map(x=>`<option ${x===(me.country||countries[0])?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>Level<select id="ql">${filters.levels.map(x=>`<option ${x===String(me.level||'200')?'selected':''}>${x}</option>`).join('')}</select></label></div><label>Subject<select id="qs"><option value="">All subjects</option>${filters.subjects.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label>Topic (optional)<select id="qt"><option value="">All topics</option></select></label><button class="btn primary full" onclick="startQuiz()">Load questions</button><p class="muted">${me.premium?'Premium access: browse the full matching bank.':'Free access: first 10 matching questions.'}</p></div>`}
async function startQuiz(){try{const country=$('qc').value,level=$('ql').value,subject=$('qs').value,topic=$('qt').value;const d=await api('/api/questions?'+new URLSearchParams({country,level,subject,topic,random:'true',limit:'50'}));quiz=d.questions||[];if(!quiz.length){alert('No questions found for that selection.');return}qIndex=0;score=0;answered=false;selected=-1;showQuestion(d)}catch(e){alert(e.message)}}
function showQuestion(meta){const q=quiz[qIndex];$('app').innerHTML+=`<div class="card"><div class="barline"><i style="width:${((qIndex+1)/quiz.length)*100}%"></i></div><p class="muted">Question ${qIndex+1} of ${quiz.length} · ${esc(q.subject)} · ${esc(q.topic||'General')}</p><div class="question">${esc(q.question)}</div>${q.options.map((o,i)=>`<button class="option" id="op${i}" onclick="answer(${i})"><b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('')}<div id="feedback"></div></div>`}
function answer(i){if(answered)return;answered=true;selected=i;const q=quiz[qIndex];const correct=i===Number(q.answer_index);if(correct)score++;for(let j=0;j<4;j++){const b=$('op'+j);if(j===Number(q.answer_index))b.classList.add('correct');if(j===i&&!correct)b.classList.add('wrong');b.disabled=true}$('feedback').innerHTML=`<div class="explain"><b class="${correct?'ok':'err'}">${correct?'Correct!':'Not quite.'}</b><br><b>Answer:</b> ${esc(q.options[q.answer_index])}<br>${esc(q.explanation||'')}</div><button class="btn primary full" style="margin-top:12px" onclick="nextQuestion()">${qIndex+1===quiz.length?'Finish':'Next'}</button>`}
async function nextQuestion(){if(qIndex+1<quiz.length){qIndex++;answered=false;selected=-1;showQuestion()}else{try{const subject=quiz[0]?.subject||'General';const d=await api('/api/scores',{method:'POST',body:JSON.stringify({subject,score,total:quiz.length})});me=(await api('/api/me')).user;alert('Quiz complete: '+score+'/'+quiz.length+' · +'+d.xp+' XP');activeTab='home';render()}catch(e){alert(e.message)}}}
async function leaderboard(){try{const d=await api('/api/leaderboard');$('app').innerHTML+=`<div class="card"><h2>🏆 Leaderboard</h2><table><tr><th>#</th><th>Name</th><th>Country</th><th>XP</th></tr>${d.leaderboard.map((u,i)=>`<tr><td>${i+1}</td><td>${esc(u.name)}</td><td>${esc(u.country)}</td><td>${Number(u.xp||0)}</td></tr>`).join('')}</table></div>`}catch(e){$('app').innerHTML+=`<div class="card err">${esc(e.message)}</div>`}}
function profile(){$('app').innerHTML+=`<div class="card"><h2>Profile</h2><label>Name<input id="pn" value="${esc(me.name)}"></label><label>University<input id="pu" value="${esc(me.university||'')}"></label><div class="row"><label>Country<select id="pc">${filters.countries.map(x=>`<option ${x===me.country?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>Level<select id="pl">${filters.levels.map(x=>`<option ${x===String(me.level||'200')?'selected':''}>${x}</option>`).join('')}</select></label></div><button class="btn primary" onclick="updateProfile()">Save profile</button></div><div class="card"><h3>Premium</h3>${me.premium?'<p class="ok"><b>Premium is active.</b></p>':'<p>Unlock the full question bank and premium access for the configured price.</p><button class="btn primary" onclick="upgrade()">Upgrade — ₦5,000</button>'}</div>`}
async function updateProfile(){try{const d=await api('/api/users/profile',{method:'PUT',body:JSON.stringify({name:$('pn').value,university:$('pu').value,country:$('pc').value,level:$('pl').value})});me=d.user;render()}catch(e){alert(e.message)}}
async function upgrade(){try{const d=await api('/api/payments/initialize',{method:'POST',body:'{}'});if(d.already_paid){me=(await api('/api/me')).user;render();return}if(d.authorization_url)location.href=d.authorization_url;else alert('Payment link was not returned.')}catch(e){alert(e.message)}}
function logout(){saveToken('');me=null;activeTab='home';render()}
boot();
</script></body></html>
