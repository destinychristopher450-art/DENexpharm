<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DENexPharm — Pharmacy Learning & Competition</title>

<style>
:root{
  --p:#2563eb;
  --bg:#f5f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#667085;
  --line:#dfe5ee;
  --good:#14804a;
  --bad:#c62828;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select{font:inherit}
button{cursor:pointer}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.top{
  position:sticky;
  top:0;
  background:#fff;
  border-bottom:1px solid var(--line);
  z-index:3;
}

.bar{
  max-width:1100px;
  margin:auto;
  padding:12px 18px;
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-weight:900;
  font-size:21px;
}

.pill{
  padding:7px 10px;
  border-radius:999px;
  background:#eef4ff;
  color:#174ea6;
  font-size:12px;
  font-weight:800;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  box-shadow:0 5px 18px rgba(16,24,40,.04);
  margin-bottom:14px;
}

.btn{
  border:0;
  border-radius:11px;
  padding:11px 14px;
  font-weight:800;
}

.primary{
  background:var(--p);
  color:#fff;
}

.ghost{
  background:#eef2f7;
  color:var(--text);
}

.danger{
  background:#feeceb;
  color:var(--bad);
}

.full{
  width:100%;
}

.muted{
  color:var(--muted);
}

input,select{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  margin:5px 0 10px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:15px 0;
}

.nav button{
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 12px;
}

.nav button.active{
  border-color:var(--p);
  color:var(--p);
}

.question{
  font-size:20px;
  font-weight:850;
  line-height:1.45;
  margin:18px 0;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  border:2px solid var(--line);
  background:#fff;
  border-radius:12px;
  padding:13px;
  margin:8px 0;
  transition:.15s ease;
}

.option:hover:not(:disabled){
  border-color:var(--p);
  background:#f8fbff;
}

.option:disabled{
  cursor:default;
}

.option.correct{
  border-color:var(--good);
  background:#ecf9f2;
}

.option.wrong{
  border-color:var(--bad);
  background:#fff1f0;
}

.explain{
  padding:12px;
  border-radius:11px;
  background:#eff6ff;
  margin-top:12px;
  line-height:1.55;
}

.barline{
  height:8px;
  background:#e8edf5;
  border-radius:99px;
  overflow:hidden;
}

.barline i{
  display:block;
  height:100%;
  background:var(--p);
  transition:width .2s ease;
}

.notice{
  padding:11px;
  border-radius:11px;
  background:#fff8df;
  margin-bottom:12px;
}

.ok{
  color:var(--good);
}

.err{
  color:var(--bad);
}

.quiz-meta{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

.score-badge{
  padding:7px 10px;
  border-radius:999px;
  background:#eef4ff;
  color:#174ea6;
  font-size:12px;
  font-weight:800;
}

.loading{
  text-align:center;
  padding:30px 10px;
  color:var(--muted);
}

@media(max-width:650px){
  .row{
    grid-template-columns:1fr;
  }

  .brand{
    font-size:18px;
  }

  .question{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="top">
  <div class="bar">
    <div class="brand">💊 DENexPharm</div>
    <div id="status"></div>
  </div>
</div>

<div class="wrap">
  <div id="app"></div>
</div>

<script>
'use strict';

/* =========================================================
   DENexPharm Frontend
   Quiz logic repaired:
   - No duplicate question IDs
   - No append-based quiz rendering
   - Current question owns its feedback
   - Next advances by qIndex only
   - Navigation/page rendering is isolated
   ========================================================= */

const API = '';

let token = localStorage.getItem('denex_token') || '';
let me = null;

let filters = {
  countries: [],
  levels: ['100','200','300','400','500','600'],
  subjects: [],
  topics: []
};

/* Quiz state */
let quiz = [];
let qIndex = 0;
let score = 0;
let answered = false;
let selected = -1;
let activeTab = 'home';

/* ---------------------------------------------------------
   DOM helper
--------------------------------------------------------- */

const $ = id => document.getElementById(id);

/* ---------------------------------------------------------
   HTML escaping
--------------------------------------------------------- */

function esc(value){
  return String(value ?? '').replace(
    /[&<>'"]/g,
    char => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[char])
  );
}

/* ---------------------------------------------------------
   API
--------------------------------------------------------- */

async function api(path, opt = {}){

  const headers = Object.assign(
    {'Content-Type':'application/json'},
    opt.headers || {}
  );

  if(token){
    headers.Authorization = 'Bearer ' + token;
  }

  const response = await fetch(
    API + path,
    Object.assign({}, opt, {headers})
  );

  let data = {};

  try{
    data = await response.json();
  }catch{
    data = {};
  }

  if(!response.ok){
    throw new Error(data.error || 'Request failed');
  }

  return data;
}

/* ---------------------------------------------------------
   Authentication token
--------------------------------------------------------- */

function saveToken(t){

  token = t || '';

  if(token){
    localStorage.setItem('denex_token', token);
  }else{
    localStorage.removeItem('denex_token');
  }
}

/* ---------------------------------------------------------
   Application boot
--------------------------------------------------------- */

async function boot(){

  try{

    await loadFilters();

    if(token){

      try{
        const data = await api('/api/me');
        me = data.user || null;
      }catch{
        saveToken('');
        me = null;
      }

    }

    render();

  }catch(error){

    $('app').innerHTML = `
      <div class="card">
        <h2>DENexPharm</h2>
        <p class="err">${esc(error.message)}</p>
        <button class="btn primary" onclick="boot()">Retry</button>
      </div>
    `;
  }
}

/* ---------------------------------------------------------
   Load question filters
--------------------------------------------------------- */

async function loadFilters(){

  filters = await api('/api/question-filters');

  filters.countries = Array.isArray(filters.countries)
    ? filters.countries
    : [];

  filters.levels = Array.isArray(filters.levels) && filters.levels.length
    ? filters.levels
    : ['100','200','300','400','500','600'];

  filters.subjects = Array.isArray(filters.subjects)
    ? filters.subjects
    : [];

  filters.topics = Array.isArray(filters.topics)
    ? filters.topics
    : [];
}

/* ---------------------------------------------------------
   Status bar
--------------------------------------------------------- */

function updateStatus(){

  if(me){

    $('status').innerHTML = `
      <span class="pill">
        ${esc(me.name)}
        · ${Number(me.xp || 0)} XP
        ${me.premium ? ' · PREMIUM' : ''}
      </span>
    `;

  }else{

    $('status').innerHTML = `
      <span class="pill">Free learning</span>
    `;
  }
}

/* ---------------------------------------------------------
   Main renderer
--------------------------------------------------------- */

function render(){

  updateStatus();

  const app = $('app');

  /*
   * IMPORTANT:
   * Completely clear the previous page.
   * The old version appended pages with +=,
   * which allowed old quiz questions and feedback
   * to remain in the DOM.
   */

  app.innerHTML = '';

  if(!me){

    authScreen();
    return;
  }

  app.innerHTML = `
    <div id="navigation"></div>
    <div id="page"></div>
  `;

  nav();

  if(activeTab === 'home'){
    home();
  }
  else if(activeTab === 'quiz'){
    quizSetup();
  }
  else if(activeTab === 'leaderboard'){
    leaderboard();
  }
  else if(activeTab === 'profile'){
    profile();
  }
}

/* ---------------------------------------------------------
   Navigation
--------------------------------------------------------- */

function nav(){

  const navigation = $('navigation');

  if(!navigation) return;

  navigation.innerHTML = `
    <div class="nav">

      <button
        class="${activeTab === 'home' ? 'active' : ''}"
        onclick="tab('home')">
        🏠 Home
      </button>

      <button
        class="${activeTab === 'quiz' ? 'active' : ''}"
        onclick="tab('quiz')">
        🧠 Quiz
      </button>

      <button
        class="${activeTab === 'leaderboard' ? 'active' : ''}"
        onclick="tab('leaderboard')">
        🏆 Leaderboard
      </button>

      <button
        class="${activeTab === 'profile' ? 'active' : ''}"
        onclick="tab('profile')">
        👤 Profile
      </button>

      <button onclick="logout()">
        Log out
      </button>

    </div>
  `;
}

function tab(tabName){

  activeTab = tabName;

  /*
   * Reset quiz display when leaving quiz.
   * The actual quiz state remains harmlessly in memory,
   * but entering Quiz again starts from setup.
   */

  render();
}

/* ---------------------------------------------------------
   Authentication screen
--------------------------------------------------------- */

function authScreen(){

  $('app').innerHTML = `
    <div class="grid">

      <div class="card">
        <h1>Learn pharmacy. Practice. Compete.</h1>

        <p class="muted">
          Country and level-aware pharmacy questions,
          explanations, XP, scores and leaderboard.
        </p>

        <div class="notice">
          Free accounts get the first 10 questions per
          country, level and subject.
          Premium unlocks the remaining bank.
        </div>
      </div>

      <div class="card">

        <div class="nav">
          <button
            id="loginTab"
            class="active"
            onclick="authMode('login')">
            Sign in
          </button>

          <button
            id="regTab"
            onclick="authMode('register')">
            Create account
          </button>
        </div>

        <div id="authForm"></div>

      </div>

    </div>
  `;

  authMode('login');
}

/* ---------------------------------------------------------
   Authentication mode
--------------------------------------------------------- */

function authMode(mode){

  const loginTab = $('loginTab');
  const regTab = $('regTab');
  const form = $('authForm');

  if(!loginTab || !regTab || !form) return;

  loginTab.classList.toggle('active', mode === 'login');
  regTab.classList.toggle('active', mode === 'register');

  if(mode === 'login'){

    form.innerHTML = `
      <h2>Sign in</h2>

      <label>
        Email
        <input id="email" type="email" autocomplete="email">
      </label>

      <label>
        Password
        <input id="password" type="password" autocomplete="current-password">
      </label>

      <button
        class="btn primary full"
        onclick="login()">
        Sign in
      </button>
    `;

  }else{

    form.innerHTML = `
      <h2>Create account</h2>

      <label>
        Name
        <input id="name" autocomplete="name">
      </label>

      <label>
        Email
        <input id="email" type="email" autocomplete="email">
      </label>

      <label>
        Password
        <input id="password" type="password" autocomplete="new-password">
      </label>

      <div class="row">

        <label>
          Country

          <select id="country">
            ${filters.countries.map(
              country => `<option>${esc(country)}</option>`
            ).join('')}
          </select>
        </label>

        <label>
          Level

          <select id="level">
            ${filters.levels.map(
              level => `<option>${esc(level)}</option>`
            ).join('')}
          </select>
        </label>

      </div>

      <label>
        University
        <input id="university">
      </label>

      <button
        class="btn primary full"
        onclick="register()">
        Create account
      </button>
    `;
  }
}

/* ---------------------------------------------------------
   Login
--------------------------------------------------------- */

async function login(){

  try{

    const email = $('email').value.trim();
    const password = $('password').value;

    if(!email || !password){
      alert('Please enter your email and password.');
      return;
    }

    const data = await api(
      '/api/auth/login',
      {
        method:'POST',
        body:JSON.stringify({
          email,
          password
        })
      }
    );

    saveToken(data.token);
    me = data.user;

    activeTab = 'home';

    render();

  }catch(error){

    alert(error.message);
  }
}

/* ---------------------------------------------------------
   Register
--------------------------------------------------------- */

async function register(){

  try{

    const name = $('name').value.trim();
    const email = $('email').value.trim();
    const password = $('password').value;
    const country = $('country').value;
    const level = $('level').value;
    const university = $('university').value.trim();

    if(!name || !email || !password){
      alert('Please complete the required fields.');
      return;
    }

    const data = await api(
      '/api/auth/register',
      {
        method:'POST',
        body:JSON.stringify({
          name,
          email,
          password,
          country,
          level,
          university
        })
      }
    );

    saveToken(data.token);
    me = data.user;

    activeTab = 'home';

    render();

  }catch(error){

    alert(error.message);
  }
}

/* ---------------------------------------------------------
   Home
--------------------------------------------------------- */

function home(){

  const page = $('page');

  page.innerHTML = `
    <div class="card">

      <h2>Welcome, ${esc(me.name)}</h2>

      <p class="muted">
        ${esc(me.country || 'Country not set')}
        · Level ${esc(me.level || '200')}
      </p>

      <div class="grid">

        <button
          class="btn primary"
          onclick="tab('quiz')">
          Start quiz
        </button>

        <button
          class="btn ghost"
          onclick="tab('leaderboard')">
          View leaderboard
        </button>

        <button
          class="btn ghost"
          onclick="tab('profile')">
          My profile
        </button>

      </div>

    </div>

    <div class="grid">

      <div class="card">
        <b>📚 Question bank</b>

        <p class="muted">
          ${filters.subjects.length}
          subjects currently represented
          in the loaded bank.
        </p>
      </div>

      <div class="card">

        <b>⭐ Access</b>

        <p>
          ${
            me.premium
              ? '<span class="ok">Premium active</span>'
              : 'Free account — 10 questions per country/level/subject'
          }
        </p>

        ${
          !me.premium
            ? `
              <button
                class="btn primary"
                onclick="upgrade()">
                Upgrade to Premium — ₦5,000
              </button>
            `
            : ''
        }

      </div>

    </div>
  `;
}

/* =========================================================
   QUIZ
   ========================================================= */

/* ---------------------------------------------------------
   Quiz setup
--------------------------------------------------------- */

function quizSetup(){

  const page = $('page');

  const countries = filters.countries.length
    ? filters.countries
    : [me.country || 'Nigeria'];

  page.innerHTML = `
    <div class="card">

      <h2>Quiz</h2>

      <div class="row">

        <label>
          Country

          <select id="qc">
            ${countries.map(country => `
              <option
                value="${esc(country)}"
                ${country === (me.country || countries[0]) ? 'selected' : ''}>
                ${esc(country)}
              </option>
            `).join('')}
          </select>

        </label>

        <label>
          Level

          <select id="ql">
            ${filters.levels.map(level => `
              <option
                value="${esc(level)}"
                ${level === String(me.level || '200') ? 'selected' : ''}>
                ${esc(level)}
              </option>
            `).join('')}
          </select>

        </label>

      </div>

      <label>
        Subject

        <select id="qs">
          <option value="">All subjects</option>

          ${filters.subjects.map(subject => `
            <option value="${esc(subject)}">
              ${esc(subject)}
            </option>
          `).join('')}

        </select>
      </label>

      <label>
        Topic (optional)

        <select id="qt">
          <option value="">All topics</option>

          ${filters.topics.map(topic => `
            <option value="${esc(topic)}">
              ${esc(topic)}
            </option>
          `).join('')}

        </select>
      </label>

      <button
        class="btn primary full"
        onclick="startQuiz()">
        Load questions
      </button>

      <p class="muted">
        ${
          me.premium
            ? 'Premium access: browse the full matching bank.'
            : 'Free access: first 10 matching questions.'
        }
      </p>

    </div>
  `;
}

/* ---------------------------------------------------------
   Start quiz
--------------------------------------------------------- */

async function startQuiz(){

  try{

    const country = $('qc').value;
    const level = $('ql').value;
    const subject = $('qs').value;
    const topic = $('qt').value;

    const page = $('page');

    page.innerHTML = `
      <div class="card loading">
        Loading questions...
      </div>
    `;

    /*
     * The server remains responsible for the actual
     * free/premium limit.
     *
     * We request a larger amount, but we display only
     * what the server actually returns.
     */

    const params = new URLSearchParams({
      country,
      level,
      subject,
      topic,
      random:'true',
      limit:'50'
    });

    const data = await api('/api/questions?' + params.toString());

    quiz = Array.isArray(data.questions)
      ? data.questions
      : [];

    /*
     * IMPORTANT:
     * Do not assume 10, 50, 100 or 110.
     * The displayed total must be the actual array length.
     */

    if(!quiz.length){

      page.innerHTML = `
        <div class="card">

          <h2>No questions found</h2>

          <p class="muted">
            No questions were returned for the selected
            country, level, subject and topic.
          </p>

          <button
            class="btn primary"
            onclick="quizSetup()">
            Back to quiz setup
          </button>

        </div>
      `;

      return;
    }

    /*
     * Reset the entire quiz state.
     */

    qIndex = 0;
    score = 0;
    answered = false;
    selected = -1;

    /*
     * Normalize questions before displaying them.
     * This makes sure the answer/explanation stay
     * attached to their original question object.
     */

    quiz = quiz
      .filter(q => q && typeof q === 'object')
      .map(normalizeQuestion);

    if(!quiz.length){

      page.innerHTML = `
        <div class="card">
          <p class="err">
            The server returned invalid question records.
          </p>

          <button
            class="btn primary"
            onclick="quizSetup()">
            Back
          </button>
        </div>
      `;

      return;
    }

    showQuestion();

  }catch(error){

    $('page').innerHTML = `
      <div class="card">

        <h2>Could not load quiz</h2>

        <p class="err">
          ${esc(error.message)}
        </p>

        <button
          class="btn primary"
          onclick="quizSetup()">
          Try again
        </button>

      </div>
    `;
  }
}

/* ---------------------------------------------------------
   Normalize one question
--------------------------------------------------------- */

function normalizeQuestion(q){

  /*
   * IMPORTANT:
   * We do not search another question for an answer
   * or explanation.
   *
   * Everything remains attached to THIS q object.
   */

  const options = Array.isArray(q.options)
    ? q.options.map(option => {

        if(option && typeof option === 'object'){
          return String(
            option.label ??
            option.text ??
            option.value ??
            ''
          );
        }

        return String(option ?? '');
      })
    : [];

  let answerIndex = Number(q.answer_index);

  if(!Number.isInteger(answerIndex)){
    answerIndex = -1;
  }

  return Object.assign({}, q, {
    options,
    answer_index: answerIndex,
    explanation: String(q.explanation || ''),
    id: q.id ?? q.question_id ?? null
  });
}

/* ---------------------------------------------------------
   Show CURRENT question
--------------------------------------------------------- */

function showQuestion(){

  const page = $('page');

  /*
   * Get exactly ONE question from the current index.
   */

  const q = quiz[qIndex];

  if(!q){

    page.innerHTML = `
      <div class="card">
        <p class="err">
          Question could not be found.
        </p>

        <button
          class="btn primary"
          onclick="quizSetup()">
          Back to quiz
        </button>
      </div>
    `;

    return;
  }

  /*
   * Reset answer state for THIS question.
   */

  answered = false;
  selected = -1;

  const total = quiz.length;
  const questionNumber = qIndex + 1;

  const progress = total > 0
    ? Math.round((questionNumber / total) * 100)
    : 0;

  /*
   * Validate answer index.
   */

  const answerIndex = Number(q.answer_index);

  /*
   * Build options from THIS question only.
   */

  const optionHTML = q.options
    .slice(0,4)
    .map((option,index) => `
      <button
        class="option"
        id="quiz-option-${index}"
        data-option-index="${index}"
        onclick="answer(${index})">

        <b>${'ABCD'[index] || index + 1}.</b>
        ${esc(option)}

      </button>
    `)
    .join('');

  page.innerHTML = `
    <div class="card">

      <div class="quiz-meta">

        <span class="muted">
          Question ${questionNumber} of ${total}
          · ${esc(q.subject || 'General')}
          · ${esc(q.topic || 'General')}
        </span>

        <span class="score-badge">
          Score: ${score}
        </span>

      </div>

      <div
        class="barline"
        aria-label="Quiz progress">

        <i style="width:${progress}%"></i>

      </div>

      <div class="question">
        ${esc(q.question)}
      </div>

      <div id="quiz-options">
        ${optionHTML}
      </div>

      <!--
        One feedback container for the CURRENT question only.
        It is recreated every time showQuestion() runs.
      -->

      <div id="quiz-feedback"></div>

    </div>
  `;
}

/* ---------------------------------------------------------
   Answer CURRENT question
--------------------------------------------------------- */

function answer(index){

  /*
   * Prevent double answering.
   */

  if(answered){
    return;
  }

  /*
   * Get the SAME question currently displayed.
   */

  const q = quiz[qIndex];

  if(!q){
    return;
  }

  const correctIndex = Number(q.answer_index);

  /*
   * Validate that the question actually has a valid
   * answer index before grading it.
   */

  if(
    !Number.isInteger(correctIndex) ||
    correctIndex < 0 ||
    correctIndex >= q.options.length
  ){

    const feedback = $('quiz-feedback');

    if(feedback){

      feedback.innerHTML = `
        <div class="explain">
          <b class="err">This question has an invalid answer key.</b>
          <br>
          Please report this question to the DENexPharm administrator.
        </div>
      `;
    }

    return;
  }

  answered = true;
  selected = index;

  const correct = index === correctIndex;

  if(correct){
    score++;
  }

  /*
   * Disable ONLY the options belonging to the CURRENT
   * question.
   */

  for(let i = 0; i < q.options.length; i++){

    const button = $('quiz-option-' + i);

    if(!button){
      continue;
    }

    button.disabled = true;

    if(i === correctIndex){
      button.classList.add('correct');
    }

    if(i === index && !correct){
      button.classList.add('wrong');
    }
  }

  /*
   * Get the feedback element belonging to THIS question.
   */

  const feedback = $('quiz-feedback');

  if(!feedback){
    return;
  }

  /*
   * IMPORTANT:
   * The answer and explanation both come from the SAME q.
   *
   * There is no lookup into another question.
   */

  const correctAnswer =
    q.options[correctIndex] || 'Answer unavailable';

  const explanation =
    q.explanation ||
    'No explanation was provided for this question.';

  const lastQuestion = qIndex === quiz.length - 1;

  feedback.innerHTML = `
    <div class="explain">

      <b class="${correct ? 'ok' : 'err'}">
        ${correct ? 'Correct!' : 'Not quite.'}
      </b>

      <br>

      <b>Answer:</b>
      ${esc(correctAnswer)}

      <br>

      ${esc(explanation)}

    </div>

    <button
      class="btn primary full"
      style="margin-top:12px"
      onclick="nextQuestion()">

      ${lastQuestion ? 'Finish' : 'Next'}

    </button>
  `;
}

/* ---------------------------------------------------------
   Next question
--------------------------------------------------------- */

function nextQuestion(){

  /*
   * Do not allow Next before answering.
   */

  if(!answered){
    return;
  }

  /*
   * Move exactly ONE index forward.
   */

  if(qIndex + 1 < quiz.length){

    qIndex++;

    /*
     * showQuestion() recreates the quiz card completely.
     * This removes all old feedback/options/question IDs.
     */

    showQuestion();

    /*
     * Scroll to the beginning of the new question.
     */

    window.scrollTo({
      top:0,
      behavior:'smooth'
    });

    return;
  }

  /*
   * Last question.
   */

  finishQuiz();
}
