<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5cff"><link rel="manifest" href="manifest.json"><title>DENexPharm — PharmBattle</title><style>:root{--p:#0b5cff;--bg:#f5f7fb;--card:#fff;--txt:#142033;--muted:#687386;--line:#e3e8f0;--good:#168a52;--bad:#c63c3c}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--txt)}.app{max-width:820px;margin:auto;min-height:100vh}header{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between}.logo{font-weight:900;color:var(--p);font-size:20px}.pill{background:#edf3ff;color:var(--p);padding:6px 9px;border-radius:99px;font-size:12px;font-weight:800}main{padding:18px 16px 92px}.hero{background:linear-gradient(135deg,#0b5cff,#6a36e8);color:white;border-radius:20px;padding:24px;margin-bottom:14px}.hero h1{margin:0 0 8px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;background:#eef2f7;color:var(--txt);cursor:pointer}.primary{background:var(--p);color:#fff}.white{background:#fff;color:var(--p)}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:5px 0 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.muted{color:var(--muted);font-size:13px}.option{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:13px;margin:8px 0;cursor:pointer}.correct{border-color:var(--good);background:#edf9f2}.wrong{border-color:var(--bad);background:#fff0f0}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(820px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:5}.nav button{border:0;background:none;padding:9px 4px;color:var(--muted);font-size:11px}.nav span{display:block;font-size:18px}.notice{padding:11px;border-radius:10px;background:#fff8df;font-size:13px}.success{color:var(--good)}.danger{color:var(--bad)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:13px}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}} </style></head><body><div class="app"><header><div class="logo">💊 DENexPharm</div><div class="pill" id="xp">0 XP</div></header><main id="screen"></main><nav class="nav"><button onclick="go('home')">🏠<span>Home</span></button><button onclick="go('quiz')">🧠<span>Quiz</span></button><button onclick="go('battle')">🏆<span>Battle</span></button><button onclick="go('tools')">🧰<span>Tools</span></button><button onclick="go('profile')">👤<span>Profile</span></button></nav></div><script>
const subjects=['Pharmacology','Pharmacokinetics','Pharmaceutics','Dispensing / Pharmacy Practice','Pharmacognosy','Pharmaceutical Microbiology','Anatomy','Physiology','Biochemistry','Pharmaceutical Chemistry','Clinical Pharmacy','Pharmaceutical Physical Chemistry','Pharmaceutical Entrepreneurship'];let token=localStorage.token||'';let me=null,quiz=[],qi=0,score=0,answered=false;
const api=async(path,opt={})=>{opt.headers={'Content-Type':'application/json',...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(path,opt),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d};
function go(x){({home:home,quiz:quizPage,battle:battle,tools:tools,profile:profile}[x]||home)();}
function render(x){document.getElementById('screen').innerHTML=x;document.getElementById('xp').textContent=(me?.xp||0)+' XP'}
async function loadMe(){if(!token)return;try{me=(await api('/api/me')).user}catch{token='';localStorage.removeItem('token')}}
async function home(){await loadMe();render(`<section class="hero"><h1>PharmBattle 🌍</h1><p>Learn • Compete • Calculate • Grow</p><button class="btn white" onclick="go('quiz')">Start Pharmacy Quiz</button></section><div class="grid"><div class="card"><b>🧠 Quiz Arena</b><p class="muted">Pharmacokinetics, dispensing, pharmaceutics and more.</p></div><div class="card"><b>🏆 Global Competition</b><p class="muted">Cloud-ready rankings by XP and score.</p></div><div class="card"><b>📚 Pharmacopoeia Hub</b><p class="muted">BP, USP–NF and Ph. Eur. educational guidance.</p></div><div class="card"><b>🌐 Language Assistant</b><p class="muted">Patient-counselling phrases across languages.</p></div><div class="card"><b>📊 GPA Calculator</b><p class="muted">Flexible 4-point and 5-point calculation.</p></div><div class="card"><b>🔄 Annual Updates</b><p class="muted">Questions are stored separately from the app.</p></div></div>${!me?`<div class="card"><b>Create your account</b><p class="muted">Accounts unlock cloud scores and leaderboards.</p><button class="btn primary" onclick="go('profile')">Sign in / Register</button></div>`:''}`)}
async function quizPage(){render('<div class="card"><h2>Choose a subject</h2>'+subjects.map(s=>`<button class="btn" style="width:100%;text-align:left;margin:4px 0" onclick="startQuiz(${JSON.stringify(s)})">${s}</button>`).join('')+'</div>')}
async function startQuiz(subject){if(!token){alert('Create an account first so your score can count on the leaderboard.');return go('profile')}try{quiz=(await api('/api/questions?subject='+encodeURIComponent(subject))).questions;if(!quiz.length)throw Error('No questions available yet for this subject.');qi=0;score=0;answered=false;showQ(subject)}catch(e){render(`<div class="card"><h2>Quiz unavailable</h2><p>${e.message}</p><button class="btn" onclick="go('quiz')">Back</button></div>`)} }
function showQ(subject){const q=quiz[qi];render(`<div class="card"><div class="muted">${subject} · Question ${qi+1}/${quiz.length}</div><h2>${q.question}</h2>${q.options.map((o,i)=>`<button class="option" id="o${i}" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<div id="feedback"></div></div>`)}
function answer(i){if(answered)return;answered=true;const q=quiz[qi];document.getElementById('o'+q.answer_index).classList.add('correct');if(i!==q.answer_index)document.getElementById('o'+i).classList.add('wrong');else score++;document.getElementById('feedback').innerHTML=`<p>${i===q.answer_index?'✅ Correct':'❌ Incorrect'}</p><p class="muted">${q.explanation||''}</p><button class="btn primary" onclick="nextQ()">${qi+1<quiz.length?'Next':'Finish'}</button>`}
async function nextQ(){if(qi+1<quiz.length){qi++;answered=false;showQ(quiz[0].subject)}else{const subject=quiz[0].subject;try{await api('/api/scores',{method:'POST',body:JSON.stringify({subject,score,total:quiz.length})});await loadMe()}catch(e){}render(`<div class="card center"><div style="font-size:48px">🏆</div><h2>Quiz complete</h2><p>You scored <b>${score}/${quiz.length}</b></p><p class="success">+${score*10} XP</p><button class="btn primary" onclick="go('battle')">View leaderboard</button></div>`)}}
async function battle(){try{let rows=(await api('/api/leaderboard')).leaderboard;render(`<div class="card"><h2>🏆 Leaderboard</h2><p class="muted">Live cloud ranking when a database is connected.</p><table><tr><th>#</th><th>Student</th><th>University</th><th>XP</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.name}</td><td>${r.university||'—'}</td><td><b>${r.xp}</b></td></tr>`).join('')||'<tr><td colspan="4">No scores yet.</td></tr>'}</table></div>`)}catch(e){render(`<div class="card"><h2>Competition</h2><p>${e.message}</p></div>`)}}
function tools(){render(`<div class="card"><h2>📊 GPA Calculator</h2><label>Scale</label><select id="scale"><option value="5">5-point</option><option value="4">4-point</option></select><div id="courses"></div><button class="btn" onclick="addCourse()">+ Add course</button> <button class="btn primary" onclick="calcGpa()">Calculate GPA</button><h2 id="gpa"></h2></div><div class="card"><h2>📚 Pharmacopoeia Hub</h2><p><b>BP</b> — British Pharmacopoeia reference framework.</p><p><b>USP–NF</b> — United States standards for medicines and related substances.</p><p><b>Ph. Eur.</b> — European Pharmacopoeia standards.</p><div class="notice">Educational summaries only. The app does not reproduce copyrighted monographs.</div></div><div class="card"><h2>🌐 Pharmacy Language Assistant</h2><input id="langSearch" placeholder="Search phrase or language" oninput="filterLang()"><div id="langs"></div></div>`);for(let i=0;i<4;i++)addCourse();filterLang()}
function addCourse(){let d=document.createElement('div');d.className='row';d.innerHTML='<input placeholder="Course"><input class="unit" type="number" min="1" value="3"><select class="grade"><option value="5">A</option><option value="4">B</option><option value="3">C</option><option value="2">D</option><option value="1">E</option><option value="0">F</option></select>';document.getElementById('courses').appendChild(d)}
function calcGpa(){let scale=+document.getElementById('scale').value;let rows=[...document.querySelectorAll('#courses .row')];let pts=0,u=0;rows.forEach(r=>{let unit=+r.querySelector('.unit').value||0,grade=+r.querySelector('.grade').value;if(scale===4&&grade===1)grade=1;pts+=unit*grade;u+=unit});document.getElementById('gpa').textContent='GPA: '+(u?(pts/u).toFixed(2):'0.00')}
const phrases=[['English','Take once daily'],['French','Prenez une fois par jour'],['Spanish','Tome una vez al día'],['Portuguese','Tome una vez ao dia'],['Arabic','مرة واحدة يوميًا'],['Hausa','Sau ɗaya a rana'],['Igbo','Otu ugboro kwa ụbọchị'],['Yoruba','Lẹẹkan lojoojumọ'],['English','Before food'],['English','After food']];function filterLang(){let q=(document.getElementById('langSearch')?.value||'').toLowerCase();document.getElementById('langs').innerHTML=phrases.filter(x=>x.join(' ').toLowerCase().includes(q)).map(x=>`<p><b>${x[0]}</b>: ${x[1]}</p>`).join('')}
function profile(){render(`<div class="card"><h2>👤 Account</h2>${me?`<p>Signed in as <b>${me.name}</b></p><p class="muted">${me.email}</p><p>${me.university||'University not set'} · ${me.country||'Country not set'} · Level ${me.level}</p><p><b>${me.xp} XP</b> · ${me.premium?'Premium':'Free'}</p><button class="btn" onclick="logout()">Sign out</button><button class="btn primary" onclick="upgrade()">Premium</button>`:`<div class="row"><div><h3>Register</h3><input id="rn" placeholder="Full name"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Password"><input id="ru" placeholder="University"><input id="rc" placeholder="Country"><input id="rl" value="200" placeholder="Level"><button class="btn primary" onclick="register()">Create account</button></div><div><h3>Login</h3><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button class="btn primary" onclick="login()">Sign in</button></div></div>`}</div><div class="card"><h3>Phase 3 status</h3><p>✅ Cloud API architecture</p><p>✅ Accounts and secure password hashing</p><p>✅ Cloud-ready scores and leaderboard</p><p>✅ Admin question-bank API</p><p>⏳ Payment/ad providers require your merchant accounts and keys</p></div>`)}
async function register(){try{let d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:rn.value,email:re.value,password:rp.value,university:ru.value,country:rc.value,level:rl.value})});token=d.token;localStorage.token=token;me=d.user;go('home')}catch(e){alert(e.message)}}async function login(){try{let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:le.value,password:lp.value})});token=d.token;localStorage.token=token;me=d.user;go('home')}catch(e){alert(e.message)}}function logout(){token='';me=null;localStorage.removeItem('token');go('home')}async function upgrade(){try{let d=await api('/api/payments/initialize',{method:'POST',body:JSON.stringify({})});if(d.authorization_url)location.href=d.authorization_url;else alert('Payment could not be started.')}catch(e){alert(e.message)}}
loadMe().then(home);</script></body></html>
